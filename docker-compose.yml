# =============================================================================
#  FIAP Cloud Games — ambiente completo local
#
#    docker compose up -d --build        (ou: docker-compose up -d --build)
#
#  Funciona SEM arquivo .env: todo valor tem default de DESENVOLVIMENTO (${VAR:-default}).
#  Para sobrescrever, crie um .env a partir do .env.example (o .env não vai para o Git).
#
#  Pré-requisito: os 5 repositórios clonados lado a lado (ver README):
#    ./fcg-orchestration  ./fcg-users-api  ./fcg-catalog-api  ./fcg-payments-api  ./fcg-notifications-api
#
#  Portas no host: Users 5001 | Catalog 5002 | Payments 5003 | Notifications 5004
#                  RabbitMQ UI 15672 | Jaeger UI 16686
#  Bancos e OTLP expostos só em 127.0.0.1 (para depurar com dotnet run / DBeaver).
# =============================================================================
name: fcg

networks:
  default:
    name: fcg-network # rede bridge dedicada: os containers se encontram pelo NOME do serviço (DNS interno)

volumes:
  rabbitmq-data:
  users-db-data:
  catalog-db-data:
  payments-db-data:

services:
  # ---------------------------------------------------------------- broker --
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq # nome do nó estável (rabbit@rabbitmq) → o volume continua válido entre recriações
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fcg}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fcg_dev_pwd}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/20-fcg.conf:/etc/rabbitmq/conf.d/20-fcg.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------- observabilidade --
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0 # o padrão é localhost: sem isto, os outros containers não enviam traces
    ports:
      - "16686:16686"            # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC (para dotnet run local)
    restart: unless-stopped

  # ------------------------------------------- um banco por microsserviço --
  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fcg_users
      POSTGRES_USER: fcg_users
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users_dev_pwd}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_users -d fcg_users"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fcg_catalog
      POSTGRES_USER: fcg_catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_pwd}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_catalog -d fcg_catalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  payments-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fcg_payments
      POSTGRES_USER: fcg_payments
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_dev_pwd}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_payments -d fcg_payments"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------- microsserviços --
  # Imagens chiseled não têm curl/wget → sem healthcheck de container aqui.
  # No Kubernetes a saúde é verificada por HTTP probes em /health/live e /health/ready.
  users-api:
    build: ../fcg-users-api
    image: fcg/users-api:1.0.0
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiDocs__Enabled: "true"
      ConnectionStrings__Database: "Host=users-db;Port=5432;Database=fcg_users;Username=fcg_users;Password=${USERS_DB_PASSWORD:-users_dev_pwd}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-fcg}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-fcg_dev_pwd}
      Jwt__Issuer: fcg-users-api
      Jwt__Audience: fcg
      # Chave privada de DESENVOLVIMENTO (pública neste repositório). Gere outra: scripts/generate-jwt-keys.sh
      Jwt__PrivateKey: ${JWT_PRIVATE_KEY:-}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@fcg.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin@12345}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "5001:8080"
    depends_on:
      users-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  catalog-api:
    build: ../fcg-catalog-api
    image: fcg/catalog-api:1.0.0
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiDocs__Enabled: "true"
      ConnectionStrings__Database: "Host=catalog-db;Port=5432;Database=fcg_catalog;Username=fcg_catalog;Password=${CATALOG_DB_PASSWORD:-catalog_dev_pwd}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-fcg}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-fcg_dev_pwd}
      Jwt__Issuer: fcg-users-api
      Jwt__Audience: fcg
      # Comunicação serviço-a-serviço pelo NOME do serviço (DNS da rede fcg-network).
      Jwt__MetadataAddress: http://users-api:8080/.well-known/openid-configuration
      Messaging__Queues__PaymentProcessed: catalog.payment-processed
      Seed__SampleGames: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "5002:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payments-api:
    build: ../fcg-payments-api
    image: fcg/payments-api:1.0.0
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiDocs__Enabled: "true"
      ConnectionStrings__Database: "Host=payments-db;Port=5432;Database=fcg_payments;Username=fcg_payments;Password=${PAYMENTS_DB_PASSWORD:-payments_dev_pwd}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-fcg}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-fcg_dev_pwd}
      Jwt__Issuer: fcg-users-api
      Jwt__Audience: fcg
      Jwt__MetadataAddress: http://users-api:8080/.well-known/openid-configuration
      Messaging__Queues__OrderPlaced: payments.order-placed
      PaymentSimulation__MaxApprovedAmount: ${PAYMENT_MAX_APPROVED_AMOUNT:-300.00}
      PaymentSimulation__ProcessingDelayMs: "1500"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "5003:8080"
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notifications-api:
    build: ../fcg-notifications-api
    image: fcg/notifications-api:1.0.0
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-fcg}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-fcg_dev_pwd}
      Messaging__Queues__UserCreated: notifications.user-created
      Messaging__Queues__PaymentProcessed: notifications.payment-processed
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "5004:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
