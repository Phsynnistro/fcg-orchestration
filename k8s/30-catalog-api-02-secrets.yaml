# =============================================================================
#  ATENÇÃO — valores de DESENVOLVIMENTO. Secret NÃO é criptografia: "data" é só Base64.
#  Qualquer um com acesso ao repositório (ou a "kubectl get secret -o yaml") lê estes valores.
#  Produção (Aula 07): Azure Key Vault/HashiCorp Vault via External Secrets Operator ou driver CSI,
#  ou Sealed Secrets — e NUNCA commitar o valor real. "stringData" é usado aqui por legibilidade.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secrets
  namespace: fcg
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
type: Opaque
stringData:
  ConnectionStrings__Database: "Host=catalog-db;Port=5432;Database=fcg_catalog;Username=fcg_catalog;Password=catalog_dev_pwd"
  RabbitMq__Username: "fcg"
  RabbitMq__Password: "fcg_dev_pwd"
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-credentials
  namespace: fcg
  labels:
    app.kubernetes.io/name: catalog-db
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "1.0.0"
type: Opaque
stringData:
  POSTGRES_DB: "fcg_catalog"
  POSTGRES_USER: "fcg_catalog"
  POSTGRES_PASSWORD: "catalog_dev_pwd"
