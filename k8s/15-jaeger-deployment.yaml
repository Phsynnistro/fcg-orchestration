# Aula 06 — Tracing distribuído. Jaeger v2 (all-in-one, armazenamento em memória: perde os traces ao reiniciar).
# Recebe OTLP dos microsserviços (ConfigMaps: OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317) e exibe a UI na 16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: fcg
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: observability
  annotations:
    kubernetes.io/change-cause: "jaegertracing/jaeger:2.20.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: fcg
        app.kubernetes.io/component: observability
      annotations:
        fcg.dev/description: "Coletor e UI de traces distribuídos (OpenTelemetry/OTLP)"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0
          env:
            # O Jaeger v2 escuta em "localhost" por padrão (herança do OpenTelemetry Collector).
            # Sem esta variável, NENHUM outro pod consegue enviar traces — e a falha é silenciosa.
            - name: JAEGER_LISTEN_HOST
              value: "0.0.0.0"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: ui
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ui
            initialDelaySeconds: 15
            periodSeconds: 20
