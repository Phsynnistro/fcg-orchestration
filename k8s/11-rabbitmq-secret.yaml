# Credenciais do broker — valores de DESENVOLVIMENTO (Secret não é criptografia; ver Secrets dos serviços).
# Cada microsserviço recebe usuário/senha pelo SEU próprio Secret (RabbitMq__Username/Password).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: fcg
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: message-broker
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "fcg"
  RABBITMQ_DEFAULT_PASS: "fcg_dev_pwd"
