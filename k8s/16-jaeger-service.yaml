apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: fcg
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
